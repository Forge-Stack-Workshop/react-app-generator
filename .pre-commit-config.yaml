default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
  # ── Standard hooks ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main, --branch=master]

  # ── Gitleaks (secrets detection) ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Console & debug detection (JS/TS) ───────────────────────────────────────
  - repo: https://github.com/chrysa/pre-commit-tools
    rev: v0.2.0-253
    hooks:
      - id: console-debug-detection
      - id: console-log-detection
      - id: console-table-detection
      - id: css-outside-stylesheet-detection

  # ── Prettier (JS/TS/JSON/YAML formatting) ───────────────────────────────────
      - id: makefile-check
      - exclude: ^(\.github/|workflows/|templates/|docker-compose)|(^|/)(pnpm-lock|yarn|uv|poetry)\.(yaml|lock)$|(^|/)\.pre-commit-config\.yaml$
        id: yaml-sorter
      - id: json-sorter
      - id: env-file-check
      - id: env-example-sync
      - id: adr-gate
      - id: claude-skill-frontmatter
      - id: claude-agent-frontmatter
      - id: claude-mcp-config
      - id: python-no-unittest-import
      - id: claude-assets-present
      - id: react-console-error-detection
      - id: no-console-warn
      - id: ts-unreachable-code
      - id: import-no-relative-parent
      - id: react-no-async-in-useeffect
      - id: react-direct-dom
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown]
        exclude: |
          (?x)^(
            package-lock\.json|
            (src/)?public/mockServiceWorker\.js|
            AGENTS\.md|
            CLAUDE\.md|
            \.claude/.*
          )$

  # ── ESLint (isolated toolchain, see tools/lint) ─────────────────────────────
  # The project builds on TypeScript 7, which typescript-eslint does not support
  # yet (its stable releases require typescript >=4.8.4 <6.1.0). mirrors-eslint
  # cannot be isolated from the project's TypeScript, so we run ESLint from a
  # self-contained toolchain in tools/lint that pins typescript@5.9.3. The runner
  # installs that toolchain on first use, so this hook needs Node/npm on PATH.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (isolated TS<6.1 toolchain)
        language: system
        entry: node tools/lint/run-eslint.mjs
        files: \.(ts|tsx)$
        types: [file]
        require_serial: true
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - args:
          - --fix
        id: markdownlint
        stages:
          - manual
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - args:
          - --error
          - DL3006
          - --error
          - DL3007
          - --failure-threshold
          - error
        files: (^|/)Dockerfile[^/]*$
        id: hadolint-docker
        types:
          - file
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - test
          - chore
          - perf
          - revert
          - ci
  - repo: https://github.com/chrysa/guideline-checker
    rev: v1.30.10
    hooks:
      - id: guideline-check
        args:
          - check
          - --fail-on
          - error
          - --baseline
          - .guideline-baseline.json
exclude: (^|/)quality_gate\.py$|^\.claude/ape/
