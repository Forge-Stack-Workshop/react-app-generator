default_language_version:
  python: python3
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
  # ── Standard hooks ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main, --branch=master]

  # ── Gitleaks (secrets detection) ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Console & debug detection (JS/TS) ───────────────────────────────────────
  - repo: https://github.com/chrysa/pre-commit-tools
    rev: v0.1.1-97
    hooks:
      - id: console-debug-detection
      - id: console-log-detection
      - id: console-table-detection
      - id: css-outside-stylesheet-detection

  # ── Prettier (JS/TS/JSON/YAML formatting) ───────────────────────────────────
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown]
        exclude: |
          (?x)^(
            package-lock\.json|
            (src/)?public/mockServiceWorker\.js|
            AGENTS\.md|
            CLAUDE\.md|
            \.claude/.*
          )$

  # ── ESLint (isolated toolchain, see tools/lint) ─────────────────────────────
  # The project builds on TypeScript 7, which typescript-eslint does not support
  # yet (its stable releases require typescript >=4.8.4 <6.1.0). mirrors-eslint
  # cannot be isolated from the project's TypeScript, so we run ESLint from a
  # self-contained toolchain in tools/lint that pins typescript@5.9.3. The runner
  # installs that toolchain on first use, so this hook needs Node/npm on PATH.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (isolated TS<6.1 toolchain)
        language: system
        entry: node tools/lint/run-eslint.mjs
        files: \.(ts|tsx)$
        types: [file]
        require_serial: true
