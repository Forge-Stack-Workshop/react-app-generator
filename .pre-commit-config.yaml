repos:
  # ── Standard hooks ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: f1dff44d3a9ae852957f34def96390f28719c232
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main, --branch=master]

  # ── Gitleaks (secrets detection) ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: 8863af47d64c3681422523e36837957c74d4af4b
    hooks:
      - id: gitleaks

  # ── Console & debug detection (JS/TS) ───────────────────────────────────────
  - repo: https://github.com/chrysa/pre-commit-tools
    rev: b97ae91d8a45eb6f556fe938fa8bd58294c9a5e6
    hooks:
      - id: console-debug-detection
      - id: console-log-detection
      - id: console-table-detection

  # ── Changelog generation ────────────────────────────────────────────────────
  - repo: https://github.com/chrysa/pre-commit-hooks-changelog
    rev: 40d13585c4c845c36108a565f00c23f2b946e9d9
    hooks:
      - id: generate-changelog

  # ── Prettier (JS/TS/JSON/YAML formatting) ───────────────────────────────────
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.1
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown]
        exclude: |
          (?x)^(
            package-lock\.json|
            public/mockServiceWorker\.js
          )$

  # ── ESLint ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.1.0
    hooks:
      - id: eslint
        files: \.(ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@9.39.1
          - typescript@5.9.3
          - typescript-eslint@8.48.0
          - eslint-plugin-react-hooks@7.0.1
          - eslint-plugin-react-refresh@0.4.24
          - "@eslint/js@9.39.1"
          - globals@16.5.0
