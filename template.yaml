# ============================================================
# Forge-Stack React Template Manifest
# Read by scaffold.mjs to drive interactive project generation
# ============================================================

meta:
  name: forge-react-template
  version: 1.0.0
  description: React template — Vite, TypeScript, SCSS, React Query
  author: Forge Stack Workshop

# ----------------------------------------------------------
# Base dependencies — always installed regardless of features
# ----------------------------------------------------------
dependencies:
  - react@^19.2.8
  - react-dom@^19.2.8
  - react-router-dom@^7.18.1
  - "@tanstack/react-query@^5.101.4"
  - lucide-react@^1.27.0

devDependencies:
  - vite@^8.1.5
  - typescript@~7.0.2
  - "@vitejs/plugin-react@^6.0.4"
  - "@types/react@^19.2.17"
  - "@types/react-dom@^19.2.3"
  - "@types/node@^26.1.1"
  - sass-embedded@^1.100.0
  - "@eslint/js@^10.0.1"
  - eslint@^10.8.0
  - eslint-plugin-react-hooks@^7.1.1
  - eslint-plugin-react-refresh@^0.5.3
  - globals@^17.8.0
  - typescript-eslint@^8.65.0

# ----------------------------------------------------------
# Features — toggled interactively during scaffolding
# deps/devDeps are merged into package.json only when enabled
# ----------------------------------------------------------
features:
  - id: i18n
    name: Internationalisation (i18n)
    description: i18next, browser language detection, LanguageSwitcher component
    default: true
    deps:
      - i18next@^26.3.6
      - react-i18next@^17.0.11
      - i18next-browser-languagedetector@^8.2.1
    options:
      languages:
        - id: fr
          name: Français
          flag: fr.svg
        - id: en
          name: English
          flag: en.svg

  - id: theming
    name: Light / Dark theme
    description: CSS variables for dark mode, useTheme hook, Header toggle
    default: true

  - id: mock
    name: MSW Mock API
    description: Mock Service Worker — intercepts /api/* requests in the browser
    default: true
    workerDirectory: public
    devDeps:
      - msw@^2.15.0

# ----------------------------------------------------------
# Domains — scaffold.mjs prompts for these interactively.
# Each entry generates: types.ts, queries.ts, mapper.ts, index.ts
# and a matching page + MSW handler (if mock is enabled).
# Leave empty to define domains only at prompt time.
# ----------------------------------------------------------
domains: []

# ----------------------------------------------------------
# Code conventions
# ----------------------------------------------------------
conventions:
  styling: scss-modules # CSS Modules + SCSS
  stateManagement: react-query # No global store — server state only
  routing: react-router-dom-v7
  mock: msw-browser
  components: functional-tsx
  exports: barrel # index.ts per domain folder
  apiBaseUrl: /api
  timeout: 8000
