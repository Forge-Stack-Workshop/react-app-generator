mode: Mainline
branches:
  main:
    regex: ^main$
    tag: ''
    increment: Patch
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
    source-branches: []
    is-source-branch-for: []
    is-release-branch: true
  develop:
    regex: ^develop$
    tag: alpha
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
    source-branches: []
    is-source-branch-for: [main]
    is-release-branch: false
  feature:
    regex: ^feature[/-]
    tag: feat
    increment: Minor
    source-branches: [develop]
    is-release-branch: false
  bugfix:
    regex: ^bugfix[/-]
    tag: fix
    increment: Patch
    source-branches: [develop, main]
    is-release-branch: false
  hotfix:
    regex: ^hotfix[/-]
    tag: hotfix
    increment: Patch
    source-branches: [main]
    is-release-branch: false
  release:
    regex: ^release[/-]
    tag: rc
    increment: Patch
    is-release-branch: true
    source-branches: [develop]
